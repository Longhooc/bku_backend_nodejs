<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giám Sát Rung Động Máy Móc</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Markdown and Math rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            color: white;
            padding: 0 20px;
        }

        .header-left img {
            height: 80px;
            width: auto;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        .header-center {
            text-align: center;
            flex-grow: 1;
        }

        .header-right {
            text-align: right;
            font-size: 1rem;
            font-weight: 500;
            min-width: 200px;
        }

        .header-right p {
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 1.3rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .device-selector {
            margin-bottom: 20px;
        }

        .device-selector select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            transition: border-color 0.3s ease;
        }

        .device-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
            margin-bottom: 20px;
        }

        .device-chart-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .device-chart-card h4 {
            color: #4a5568;
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .status-indicators {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .status-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .status-label {
            color: #666;
            font-size: 0.9rem;
        }

        .normal {
            color: #48bb78;
        }

        .warning {
            color: #ed8936;
        }

        .critical {
            color: #f56565;
        }

        .alerts-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .alert-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid;
        }

        .alert-critical {
            background: #fed7d7;
            border-left-color: #f56565;
        }

        .alert-high {
            background: #feebc8;
            border-left-color: #ed8936;
        }

        .alert-medium {
            background: #fef5e7;
            border-left-color: #f6e05e;
        }

        .alert-low {
            background: #f0fff4;
            border-left-color: #48bb78;
        }

        .no-data {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 40px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.1rem;
        }

        /* AI Result Markdown Styling */
        .ai-result-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
            font-size: 0.85rem;
        }

        .ai-result-content table th,
        .ai-result-content table td {
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            text-align: left;
        }

        .ai-result-content table th {
            background: #f7fafc;
            font-weight: 600;
            color: #4a5568;
        }

        .ai-result-content table tr:nth-child(even) {
            background: #f9fafb;
        }

        .ai-result-content h1,
        .ai-result-content h2,
        .ai-result-content h3,
        .ai-result-content h4 {
            color: #2d3748;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .ai-result-content h3 {
            font-size: 1.1rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }

        .ai-result-content ul,
        .ai-result-content ol {
            margin: 10px 0;
            padding-left: 25px;
        }

        .ai-result-content li {
            margin: 5px 0;
        }

        .ai-result-content code {
            background: #f7fafc;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
        }

        .ai-result-content pre {
            background: #f7fafc;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .ai-result-content hr {
            border: none;
            border-top: 2px solid #e2e8f0;
            margin: 20px 0;
        }

        .ai-result-content strong {
            font-weight: 700;
            color: #1a202c;
        }

        .ai-result-content em {
            font-style: italic;
        }

        .ai-result-content blockquote {
            border-left: 4px solid #667eea;
            padding-left: 15px;
            margin: 15px 0;
            color: #4a5568;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .header-right {
                text-align: center;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/de/HCMUT_official_logo.png"
                    alt="BKU HCM Logo">
            </div>
            <div class="header-center">
                <h1>Hệ Thống Giám Sát Rung Động Máy Móc</h1>
                <p>Giám sát thời gian thực và phát hiện độ rung bất thường</p>
            </div>
            <div class="header-right">
                <p>SVTT: Hồ Công Long</p>
                <p>GVHD: PGS.TS Trương Quang Vinh</p>
            </div>
        </div>

        <div class="card">
            <h3>📊 Biểu đồ tất cả node </h3>
            <div style="display:flex; gap:10px; align-items:center; margin:10px 0 20px 0; flex-wrap: wrap;">
                <span style="color:#4a5568; font-weight:600;">Khoảng thời gian:</span>
                <button class="range-btn" data-hours="3">3 giờ</button>
                <button class="range-btn" data-hours="24">1 ngày</button>
                <button class="range-btn" data-hours="72">3 ngày</button>
                <button class="range-btn" data-hours="168">1 tuần</button>
                <button class="range-btn" data-hours="720">1 tháng</button>
                <button class="range-btn" data-hours="8760">1 năm</button>
                <button id="autoRefreshToggle"
                    style="margin-left:20px; padding:8px 12px; border-radius:8px; border:2px solid #48bb78; background:#48bb78; color:#fff; cursor:pointer;">Tự
                    động: BẬT</button>
                <span id="rangeStatus" style="margin-left:auto; color:#666; font-size:0.9rem;"></span>
            </div>
            <div id="allCharts">
                <div class="no-data">Đang tải thiết bị...</div>
            </div>
        </div>

        <!-- Alerts Section -->
        <div class="alerts-section">
            <h3>🚨 Cảnh báo Rung động</h3>
            <div id="alertsList">
                <div class="loading">Đang tải cảnh báo...</div>
            </div>
        </div>


    </div>

    <script>
        // Global variables
        let socket;
        const deviceCharts = new Map(); // device_id -> { chart, device }
        const deviceLastTimestamp = new Map(); // device_id -> last data time (ms)
        let currentRangeHours = 24;
        let rangeChangeTimer = null;
        let autoRefreshInterval = null;
        let autoRefreshEnabled = true;
        // Store canonical series per device to simplify incremental updates
        // Structure: Map<deviceId, Array<{ t: number /*ms*/, magnitude: number, baseline: number, is_abnormal: boolean, severity: string }>>
        const deviceDataStore = new Map();
        // Track socket connection status to gate polling
        let socketConnected = false;

        // Plugin to draw red background for disconnection periods
        const disconnectionPlugin = {
            id: 'disconnectionPlugin',
            beforeDraw: (chart, args, options) => {
                const { ctx, chartArea: { top, bottom, left, right, width, height }, scales: { x } } = chart;
                const gaps = options.gaps || [];

                if (!gaps.length) return;

                ctx.save();
                ctx.fillStyle = 'rgba(255, 99, 132, 0.2)'; // Red with opacity

                gaps.forEach(gap => {
                    const startPixel = x.getPixelForValue(gap.start);
                    const endPixel = x.getPixelForValue(gap.end);

                    // Ensure the rectangle is within the chart area
                    const drawStart = Math.max(left, startPixel);
                    const drawEnd = Math.min(right, endPixel);

                    if (drawEnd > drawStart) {
                        ctx.fillRect(drawStart, top, drawEnd - drawStart, height);
                    }
                });

                ctx.restore();
            }
        };

        Chart.register(disconnectionPlugin);

        // Initialize application
        document.addEventListener('DOMContentLoaded', function () {
            console.log('🚀 Application starting...');

            try {
                console.log('🔌 Initializing socket...');
                initializeSocket();

                console.log('📱 Loading devices...');
                loadDevicesAndRenderAll();

                initRangeButtons();
                initAutoRefreshToggle();
                updateRangeStatus();

                console.log('🚨 Loading alerts...');
                loadAlerts();

                // Start auto-refresh
                startAutoRefresh();

                console.log('✅ Application initialized successfully');
            } catch (error) {
                console.error('❌ Application initialization failed:', error);
            }
        });

        // Initialize Socket.IO connection
        function initializeSocket() {
            console.log('🔌 Creating socket connection...');
            socket = io();

            socket.on('connect', function () {
                console.log('✅ Connected to server');
                socketConnected = true;
            });

            socket.on('sensor_data', function (data) {
                console.log('📡 Received realtime data:', data);
                const chartInfo = deviceCharts.get(data.device_id);
                if (!chartInfo) {
                    console.log('⚠️ No chart found for device:', data.device_id);
                    return;
                }
                console.log('✅ Adding data to chart for device:', data.device_id);
                appendRealtimePoint(chartInfo, data);

                // Update battery voltage display if present
                if (data.battery_voltage_mv !== undefined) {
                    updateBatteryVoltage(data.device_id, data.battery_voltage_mv);
                }
            });

            socket.on('disconnect', function () {
                console.log('❌ Disconnected from server');
                socketConnected = false;
            });

            socket.on('connect_error', function (error) {
                console.error('❌ Socket connection error:', error);
            });
        }

        // Init range selector buttons
        function initRangeButtons() {
            const buttons = document.querySelectorAll('.range-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const hours = parseInt(btn.getAttribute('data-hours'));
                    if (!isNaN(hours) && hours !== currentRangeHours) {
                        currentRangeHours = hours;
                        highlightActiveRangeButton();
                        updateRangeStatus();
                        // Debounce reload
                        if (rangeChangeTimer) clearTimeout(rangeChangeTimer);
                        rangeChangeTimer = setTimeout(() => {
                            reloadAllHistorical();
                            // cũng cập nhật phạm vi cảnh báo theo khoảng chọn (giới hạn tối đa 168 giờ để tránh quá nặng)
                            loadAlerts();
                        }, 300);
                    }
                });
            });
            highlightActiveRangeButton();
        }

        function highlightActiveRangeButton() {
            document.querySelectorAll('.range-btn').forEach(b => {
                if (parseInt(b.getAttribute('data-hours')) === currentRangeHours) {
                    b.style.background = '#667eea';
                    b.style.color = '#fff';
                    b.style.border = 'none';
                    b.style.padding = '8px 12px';
                    b.style.borderRadius = '8px';
                } else {
                    b.style.background = '#fff';
                    b.style.color = '#4a5568';
                    b.style.border = '2px solid #e2e8f0';
                    b.style.padding = '8px 12px';
                    b.style.borderRadius = '8px';
                }
            });
        }

        function updateRangeStatus() {
            const el = document.getElementById('rangeStatus');
            if (!el) return;
            el.textContent = `Phạm vi: ${formatHoursLabel(currentRangeHours)}`;
        }

        function formatHoursLabel(hours) {
            if (hours === 3) return '3 giờ';
            if (hours === 24) return '1 ngày';
            if (hours === 72) return '3 ngày';
            if (hours === 168) return '1 tuần';
            if (hours === 720) return '1 tháng';
            if (hours === 8760) return '1 năm';
            return `${hours} giờ`;
        }

        function reloadAllHistorical() {
            deviceCharts.forEach((chartInfo, deviceId) => {
                loadHistoricalForDevice(deviceId);
                // Also update time range for existing charts
                updateChartTimeRange(chartInfo.chart);
            });
        }

        // Auto-refresh functions
        function startAutoRefresh() {
            // Clear existing interval
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }

            if (!autoRefreshEnabled) {
                console.log('⏸️ Auto-refresh disabled');
                return;
            }

            // Auto-refresh every 30 seconds
            autoRefreshInterval = setInterval(() => {
                if (autoRefreshEnabled) {
                    console.log('🔄 Auto-refreshing data...');
                    // If socket is connected, skip polling sensor data to avoid redundancy
                    if (!socketConnected) {
                        refreshIncrementalAll();
                    }
                    loadAlerts();
                }
            }, 30000);

            console.log('✅ Auto-refresh started (30s interval)');
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                console.log('⏹️ Auto-refresh stopped');
            }
        }

        // Initialize auto-refresh toggle button
        function initAutoRefreshToggle() {
            const toggleBtn = document.getElementById('autoRefreshToggle');
            if (!toggleBtn) return;

            toggleBtn.addEventListener('click', () => {
                autoRefreshEnabled = !autoRefreshEnabled;

                if (autoRefreshEnabled) {
                    startAutoRefresh();
                    toggleBtn.textContent = 'Tự động: BẬT';
                    toggleBtn.style.background = '#48bb78';
                    toggleBtn.style.borderColor = '#48bb78';
                } else {
                    stopAutoRefresh();
                    toggleBtn.textContent = 'Tự động: TẮT';
                    toggleBtn.style.background = '#f56565';
                    toggleBtn.style.borderColor = '#f56565';
                }
            });
        }

        // Create per-device chart card (one chart per row)
        function createDeviceChartCard(device) {
            const card = document.createElement('div');
            card.className = 'device-chart-card';

            const title = document.createElement('h4');
            title.textContent = `${device.device_name || device.device_id}${(device.location && device.location !== 'Unknown') ? ' — ' + device.location : ''}`;

            // Battery voltage display
            const batteryContainer = document.createElement('div');
            batteryContainer.style.cssText = 'display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding: 10px; background: #f7fafc; border-radius: 8px;';
            const batteryLabel = document.createElement('span');
            batteryLabel.textContent = '🔋 Điện áp pin:';
            batteryLabel.style.cssText = 'font-weight: 600; color: #4a5568;';
            const batteryValue = document.createElement('span');
            batteryValue.id = `battery_${device.device_id}`;
            batteryValue.textContent = '-- mV';
            batteryValue.style.cssText = 'font-size: 1.1rem; font-weight: bold; color: #667eea;';
            batteryContainer.appendChild(batteryLabel);
            batteryContainer.appendChild(batteryValue);

            // Status indicator
            const statusContainer = document.createElement('div');
            statusContainer.style.cssText = 'display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding: 10px; background: #f7fafc; border-radius: 8px;';
            const statusLabel = document.createElement('span');
            statusLabel.textContent = '📡 Trạng thái:';
            statusLabel.style.cssText = 'font-weight: 600; color: #4a5568;';
            const statusValue = document.createElement('span');
            statusValue.id = `status_${device.device_id}`;
            statusValue.textContent = 'Đang kiểm tra...';
            statusValue.style.cssText = 'font-weight: bold; color: #667eea;';
            statusContainer.appendChild(statusLabel);
            statusContainer.appendChild(statusValue);

            const container = document.createElement('div');
            container.className = 'chart-container';
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);

            card.appendChild(title);
            card.appendChild(batteryContainer);
            card.appendChild(statusContainer);
            card.appendChild(container);

            // Add AI Analysis section
            if (typeof createDeviceAISection === 'function') {
                const aiSection = createDeviceAISection(device.device_id);
                card.appendChild(aiSection);
            }

            // Initialize battery value from device meta if available (write directly to created element)
            if (device.last_battery_voltage_mv !== undefined && device.last_battery_voltage_mv !== null) {
                const mv = Number(device.last_battery_voltage_mv);
                if (Number.isFinite(mv)) {
                    setBatteryDisplay(batteryValue, mv);
                }
            }

            const ctx = canvas.getContext('2d');
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Magnitude',
                            data: [], // {x: Date, y: number}
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            tension: 0.3,
                            fill: true,
                            pointRadius: 3, // Show points for visibility
                            pointHoverRadius: 5,
                            pointBackgroundColor: [], // Will be set dynamically based on is_abnormal
                            pointBorderColor: [], // Will be set dynamically
                            pointBorderWidth: 1
                        },
                        {
                            label: 'Baseline',
                            data: [],
                            borderColor: '#48bb78',
                            backgroundColor: 'transparent',
                            borderDash: [5, 5],
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 750
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                tooltipFormat: 'dd/MM/yyyy HH:mm:ss',
                                displayFormats: {
                                    second: 'HH:mm:ss',
                                    minute: 'HH:mm',
                                    hour: 'HH:mm'
                                }
                            },
                            title: { display: true, text: 'Thời gian' }
                        },
                        y: {
                            title: { display: true, text: 'Độ rung (m/s²)' }
                        }
                    },
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                title: function (context) {
                                    const date = context[0].raw.x;
                                    return new Date(date).toLocaleString('vi-VN');
                                }
                            }
                        }
                    },
                    interaction: { mode: 'nearest', axis: 'x', intersect: false },
                    plugins: {
                        disconnectionPlugin: {
                            gaps: [] // Will be populated dynamically
                        }
                    }
                },
                plugins: [disconnectionPlugin]
            });

            return { card, chart };
        }

        // Load devices and render all charts (excluding simulated)
        async function loadDevicesAndRenderAll() {
            console.log('🔄 Loading devices...');
            try {
                const response = await fetch('/api/devices?include_simulated=0&_ts=' + Date.now(), { cache: 'no-store' });
                console.log('📡 API Response status:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const devices = await response.json();
                console.log('📱 Devices received:', devices);

                const container = document.getElementById('allCharts');
                container.innerHTML = '';

                if (devices.length === 0) {
                    container.innerHTML = '<div class="no-data">Không có thiết bị hoạt động</div>';
                    return;
                }

                for (const device of devices) {
                    const { card, chart } = createDeviceChartCard(device);
                    container.appendChild(card);
                    deviceCharts.set(device.device_id, { chart, device });
                    // Load historical data for each device
                    loadHistoricalForDevice(device.device_id);
                    // Load FFT events for AI analysis
                    if (typeof loadFFTEvents === 'function') {
                        loadFFTEvents(device.device_id);
                    }
                }

            } catch (error) {
                console.error('❌ Error loading devices:', error);
                const container = document.getElementById('allCharts');
                container.innerHTML = '<div class="no-data">Lỗi tải danh sách thiết bị</div>';
            }
        }

        // Load historical data for one device
        async function loadHistoricalForDevice(deviceId) {
            try {
                console.log(`📊 Loading historical data for: ${deviceId} (${currentRangeHours}h)`);
                const limit = computeLimitByHours(currentRangeHours);
                const url = `/api/sensor-data/${deviceId}?hours=${currentRangeHours}&limit=${limit}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const result = await response.json();
                console.log(`📊 Received data for ${deviceId}:`, result.data.length, 'points');

                const chartInfo = deviceCharts.get(deviceId);
                if (!chartInfo) {
                    console.error('❌ No chart found for device:', deviceId);
                    return;
                }
                // Build canonical store for this device
                const raw = result.data || [];
                const series = raw.map(d => ({
                    t: new Date(d.timestamp).getTime(),
                    magnitude: d.vibration_magnitude,
                    baseline: d.vibration_magnitude * 0.8,
                    is_abnormal: d.is_abnormal === 1 || d.is_abnormal === true,
                    severity: 'NORMAL' // Historical data doesn't have severity, default to NORMAL
                }));
                deviceDataStore.set(deviceId, series);
                // Render from store constrained to current window
                renderChartFromStore(deviceId, chartInfo);
                // Track last timestamp for incremental
                if (series.length > 0) {
                    deviceLastTimestamp.set(deviceId, series[series.length - 1].t);
                }
            } catch (e) {
                console.error('❌ Load historical failed for', deviceId, e);
            }
        }

        function computeLimitByHours(hours) {
            // Tăng limit: lấy 1000 điểm/giờ, tối đa 100000, tối thiểu 2000
            const points = Math.min(100000, Math.max(2000, Math.floor(hours * 1000)));
            return points;
        }

        // Helper: lấy timestamp mới nhất từ dataset chính
        function getChartLatestTimestamp(chart) {
            const ds = chart?.data?.datasets?.[0]?.data || [];
            if (ds.length === 0) return null;
            const last = ds[ds.length - 1];
            const t = new Date(last.x).getTime();
            return Number.isFinite(t) ? t : null;
        }

        // Apply historical data to a device chart (with time x-axis)
        function applyHistoricalToChart(chartInfo, data) {
            console.log('📈 Applying', data.length, 'data points to chart');
            const deviceId = chartInfo.device?.device_id || [...deviceCharts.entries()].find(([, v]) => v.chart === chartInfo.chart)?.[0];
            // Backward compatibility: store then render
            const series = (data || []).map(d => ({
                t: new Date(d.timestamp).getTime(),
                magnitude: d.vibration_magnitude,
                baseline: d.vibration_magnitude * 0.8,
                is_abnormal: d.is_abnormal === 1 || d.is_abnormal === true,
                severity: 'NORMAL'
            }));
            deviceDataStore.set(deviceId, series);
            renderChartFromStore(deviceId, chartInfo);
        }

        // Helper function to get point color based on abnormality and severity
        function getPointColor(is_abnormal, severity) {
            if (!is_abnormal) {
                return 'rgba(102, 126, 234, 0.6)'; // Normal blue with transparency
            }

            // Color code based on severity
            switch (severity) {
                case 'CRITICAL':
                    return '#f56565'; // Red
                case 'HIGH':
                    return '#ed8936'; // Orange
                case 'MEDIUM':
                    return '#f6e05e'; // Yellow
                default:
                    return '#48bb78'; // Green for abnormal but low severity
            }
        }

        // Render helper from canonical store, trimming outside current range
        function renderChartFromStore(deviceId, chartInfo) {
            const series = deviceDataStore.get(deviceId) || [];
            if (series.length === 0) {
                chartInfo.chart.data.datasets[0].data = [];
                chartInfo.chart.data.datasets[1].data = [];
                chartInfo.chart.update();
                return;
            }
            const end = series[series.length - 1].t || Date.now();
            const rangeMs = currentRangeHours * 3600 * 1000;
            const start = end - rangeMs;
            const windowed = series.filter(p => p.t >= start && p.t <= end);

            // Update chart data with color coding
            chartInfo.chart.data.datasets[0].data = windowed.map(p => ({ x: new Date(p.t), y: p.magnitude }));
            chartInfo.chart.data.datasets[1].data = windowed.map(p => ({ x: new Date(p.t), y: p.baseline }));

            // Apply dynamic colors based on abnormality
            const colors = windowed.map(p => getPointColor(p.is_abnormal, p.severity));
            chartInfo.chart.data.datasets[0].pointBackgroundColor = colors;
            chartInfo.chart.data.datasets[0].pointBorderColor = colors;

            updateChartTimeRange(chartInfo.chart);
            chartInfo.chart.update();
            if (windowed.length > 0) deviceLastTimestamp.set(deviceId, windowed[windowed.length - 1].t);

            // Calculate gaps > 12 minutes (720,000 ms)
            const gaps = [];
            const GAP_THRESHOLD = 12 * 60 * 1000; // 12 minutes

            for (let i = 1; i < windowed.length; i++) {
                const diff = windowed[i].t - windowed[i - 1].t;
                if (diff > GAP_THRESHOLD) {
                    gaps.push({
                        start: windowed[i - 1].t,
                        end: windowed[i].t
                    });
                }
            }

            // Check for gap at the end (if no data recently)
            const now = Date.now();
            const lastPoint = windowed[windowed.length - 1];

            if (lastPoint && (now - lastPoint.t > GAP_THRESHOLD)) {
                gaps.push({
                    start: lastPoint.t,
                    end: now
                });
                // Update status text
                updateDeviceStatus(deviceId, false, lastPoint.t);
            } else {
                // Update status text (Active)
                updateDeviceStatus(deviceId, true, lastPoint ? lastPoint.t : null);
            }

            // Update plugin options
            chartInfo.chart.options.plugins.disconnectionPlugin.gaps = gaps;

            chartInfo.chart.update();
        }

        function updateDeviceStatus(deviceId, isActive, lastTimestamp) {
            const el = document.getElementById(`status_${deviceId}`);
            if (!el) return;

            if (isActive) {
                el.textContent = 'Đang hoạt động';
                el.style.color = '#48bb78'; // Green
            } else {
                const timeStr = lastTimestamp ? new Date(lastTimestamp).toLocaleString('vi-VN') : 'Không xác định';
                el.textContent = `Mất kết nối (Lần cuối: ${timeStr})`;
                el.style.color = '#f56565'; // Red
            }
        }

        // Update chart time range configuration
        function updateChartTimeRange(chart) {
            // Ưu tiên dùng timestamp mới nhất có trong chart để cố định cửa sổ
            const latestTs = getChartLatestTimestamp(chart);
            const now = latestTs ?? Date.now();
            const startTime = now - currentRangeHours * 3600 * 1000;

            const xScale = chart.options.scales.x;
            // Use primitive timestamps to avoid Date proxy issues
            xScale.min = startTime;
            xScale.max = now;

            // Only mutate existing objects; avoid reassigning nested option objects
            const timeOpts = xScale.time || (xScale.time = {});
            let desiredUnit;
            if (currentRangeHours <= 6) {
                desiredUnit = 'minute';
            } else if (currentRangeHours <= 24) {
                desiredUnit = 'hour';
            } else if (currentRangeHours <= 168) {
                desiredUnit = 'day';
            } else if (currentRangeHours <= 720) {
                desiredUnit = 'day';
            } else {
                desiredUnit = 'month';
            }
            if (timeOpts.unit !== desiredUnit) timeOpts.unit = desiredUnit;

            // Update display formats without replacing the object reference
            if (!timeOpts.displayFormats) timeOpts.displayFormats = {};
            const df = timeOpts.displayFormats;
            if (currentRangeHours <= 6) {
                df.second = 'HH:mm:ss';
                df.minute = 'HH:mm';
                df.hour = 'HH:mm';
                delete df.day; delete df.week; delete df.month;
            } else if (currentRangeHours <= 24) {
                delete df.second;
                df.minute = 'HH:mm';
                df.hour = 'HH:mm';
                delete df.day; delete df.week; delete df.month;
            } else if (currentRangeHours <= 168) {
                delete df.second; delete df.minute;
                df.hour = 'HH:mm';
                df.day = 'dd/MM';
                delete df.week; delete df.month;
            } else if (currentRangeHours <= 720) {
                delete df.second; delete df.minute; delete df.hour;
                df.day = 'dd/MM';
                df.week = 'dd/MM';
                delete df.month;
            } else {
                delete df.second; delete df.minute; delete df.hour; delete df.week;
                df.day = 'dd/MM';
                df.month = 'MM/yyyy';
            }
        }

        // Shared battery display helper
        function setBatteryDisplay(el, voltageMv) {
            const voltageV = (voltageMv / 1000).toFixed(2);
            el.textContent = `${voltageMv} mV (${voltageV} V)`;
            if (voltageMv < 3000) {
                el.style.color = '#f56565';
            } else if (voltageMv < 3200) {
                el.style.color = '#ed8936';
            } else {
                el.style.color = '#48bb78';
            }
        }

        // Update battery voltage display by deviceId (for websocket path)
        function updateBatteryVoltage(deviceId, voltageMv) {
            const batteryElement = document.getElementById(`battery_${deviceId}`);
            if (batteryElement) {
                setBatteryDisplay(batteryElement, voltageMv);
            }
        }

        // Append realtime point to device chart
        function appendRealtimePoint(chartInfo, data) {
            console.log('📊 Appending point:', data.vibration_magnitude);
            const deviceId = chartInfo.device?.device_id || [...deviceCharts.entries()].find(([, v]) => v.chart === chartInfo.chart)?.[0];
            const ts = new Date(data.timestamp).getTime();
            const series = deviceDataStore.get(deviceId) || [];
            // Guard duplicate or out-of-order data
            const lastTs = series.length ? series[series.length - 1].t : -Infinity;
            if (!(ts > lastTs)) {
                // Ignore if timestamp is not strictly newer
                return;
            }
            series.push({
                t: ts,
                magnitude: data.vibration_magnitude,
                baseline: data.baseline,
                is_abnormal: data.is_abnormal === true || data.is_abnormal === 1,
                severity: data.severity || 'NORMAL'
            });
            deviceDataStore.set(deviceId, series);
            // Trim outside window by time
            const end = ts;
            const start = end - currentRangeHours * 3600 * 1000;
            while (series.length && series[0].t < start) series.shift();
            // Re-render from store
            renderChartFromStore(deviceId, chartInfo);
            console.log('✅ Chart updated. Current data points:', series.length);
        }

        // Update chart with new data point
        function updateChart(data) {
            console.log('📊 Adding new data point:', data.vibration_magnitude);

            // Use simple index for x-axis
            const newIndex = chartData.labels.length;
            chartData.labels.push(newIndex);
            chartData.datasets[0].data.push(data.vibration_magnitude);
            chartData.datasets[1].data.push(data.baseline);

            // Keep only last 100 data points
            if (chartData.labels.length > 100) {
                chartData.labels.shift();
                chartData.datasets[0].data.shift();
                chartData.datasets[1].data.shift();
            }

            if (vibrationChart) {
                vibrationChart.update('none');
                console.log('✅ Chart updated with new data');
            } else {
                console.error('❌ Chart not initialized');
            }
        }

        // Load alerts
        async function loadAlerts() {
            try {
                // hạn chế tối đa 168 giờ cho mục cảnh báo để danh sách dễ đọc
                const alertHours = Math.min(currentRangeHours, 168);
                const response = await fetch(`/api/alerts?hours=${alertHours}`);
                const alerts = await response.json();
                displayAlerts(alerts);
            } catch (error) {
                console.error('Error loading alerts:', error);
            }
        }

        // Display alerts
        function displayAlerts(alerts) {
            const alertsList = document.getElementById('alertsList');

            if (alerts.length === 0) {
                alertsList.innerHTML = '<div class="no-data">Không có cảnh báo nào trong 24 giờ qua</div>';
                return;
            }

            alertsList.innerHTML = alerts.map(alert => `
                <div class="alert-item alert-${alert.severity.toLowerCase()}">
                    <strong>${alert.device_name || alert.device_id}</strong> - ${alert.severity}
                    <br>
                    <small>${alert.message}</small>
                    <br>
                    <small>${new Date(alert.timestamp).toLocaleString('vi-VN')}</small>
                </div>
            `).join('');
        }

        // Auto-refresh alerts every 30 seconds
        setInterval(loadAlerts, 30000);

        // Incremental refresh: chỉ tải điểm mới kể từ last timestamp mỗi device
        async function refreshIncrementalAll() {
            for (const [deviceId, chartInfo] of deviceCharts.entries()) {
                try {
                    const stored = deviceDataStore.get(deviceId) || [];
                    const lastTsMs = stored.length ? stored[stored.length - 1].t : 0;
                    let url;
                    if (lastTsMs > 0) {
                        const lastStr = new Date(lastTsMs).toISOString().replace('T', ' ').substring(0, 19);
                        // Chỉ lấy điểm mới hơn mốc cuối cùng
                        const limit = 20000;
                        url = `/api/sensor-data/${deviceId}?since=${encodeURIComponent(lastStr)}&limit=${limit}`;
                    } else {
                        // Fallback: lấy trong vài giờ gần nhất nếu chưa có mốc
                        const hours = Math.min(currentRangeHours, 6);
                        const limit = computeLimitByHours(hours);
                        url = `/api/sensor-data/${deviceId}?hours=${hours}&limit=${limit}`;
                    }
                    const response = await fetch(url);
                    if (!response.ok) continue;
                    const result = await response.json();
                    const incoming = result.data || [];
                    if (incoming.length === 0) continue;
                    // Append to store first
                    incoming.forEach(d => {
                        const t = new Date(d.timestamp).getTime();
                        if (t > lastTsMs) {
                            stored.push({
                                t,
                                magnitude: d.vibration_magnitude,
                                baseline: d.vibration_magnitude * 0.8,
                                is_abnormal: d.is_abnormal === 1 || d.is_abnormal === true,
                                severity: 'NORMAL'
                            });
                        }
                    });
                    // Trim store to current window relative to latest t
                    const end = stored.length ? stored[stored.length - 1].t : Date.now();
                    const start = end - currentRangeHours * 3600 * 1000;
                    while (stored.length && stored[0].t < start) stored.shift();
                    deviceDataStore.set(deviceId, stored);
                    // Re-render from store
                    renderChartFromStore(deviceId, chartInfo);
                } catch (err) {
                    console.error('Incremental refresh failed for', deviceId, err);
                }
            }
        }
    </script>
